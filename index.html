<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Certificados Escoteiros</title>

    <!-- Biblioteca para geração de PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #1a365d;
        }

        .card-secao {
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }

        .card-secao h3 {
            margin-bottom: 15px;
            color: #2b6cb0;
            border-bottom: 2px solid #edf2f7;
            padding-bottom: 8px;
        }

        /* Estilos dos Botões de Categoria */
        .botoes-categorias {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
            margin-bottom: 12px;
        }

        .btn-cat {
            background-color: #edf2f7;
            color: #4a5568;
            border: 1px solid #cbd5e0;
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        .btn-cat:hover {
            background-color: #e2e8f0;
        }

        .btn-cat.active {
            background-color: #2b6cb0;
            color: #ffffff;
            border-color: #2b6cb0;
        }

        /* Grade dos Botões de Certificados */
        .grid-certificados {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 8px;
            max-height: 220px;
            overflow-y: auto;
            padding: 10px;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            background-color: #f8fafc;
        }

        .btn-modelo {
            background-color: #ffffff;
            color: #2d3748;
            border: 1px solid #cbd5e0;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            text-align: center;
            transition: all 0.2s ease;
        }

        .btn-modelo:hover {
            border-color: #3182ce;
            background-color: #ebf8ff;
        }

        .btn-modelo.selected {
            background-color: #3182ce;
            color: white;
            border-color: #2b6cb0;
            font-weight: bold;
        }

        /* Formulário e Inputs */
        .grid-form {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .col-full {
            grid-column: span 2;
        }

        .grid-data {
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            gap: 8px;
        }

        .campo {
            display: flex;
            flex-direction: column;
        }

        .campo label {
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 5px;
            color: #4a5568;
        }

        .campo input, .campo textarea {
            padding: 10px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 0.95rem;
        }

        .campo input:focus, .campo textarea:focus {
            outline: none;
            border-color: #3182ce;
            box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.2);
        }

        .status-info {
            font-size: 0.85rem;
            color: #718096;
            margin-top: 5px;
        }

        /* Canvas de Pré-visualização em Tempo Real */
        .canvas-wrapper {
            width: 100%;
            overflow-x: auto;
            text-align: center;
            background: #e2e8f0;
            padding: 10px;
            border-radius: 8px;
            margin-top: 15px;
        }

        #canvasCertificado {
            max-width: 100%;
            height: auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .btn-download {
            display: block;
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            background-color: #38a169;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .btn-download:hover {
            background-color: #2f855a;
        }

        @media (max-width: 600px) {
            .grid-form {
                grid-template-columns: 1fr;
            }
            .col-full {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Gerador de Certificados Escoteiros</h1>

        <!-- 1. SEÇÃO DA LOGO -->
        <div class="card-secao">
            <h3>Logo do Grupo (UEL)</h3>
            <div class="campo">
                <input type="file" id="logoInput" accept="image/*" onchange="carregarLogo(event)">
                <p id="statusLogo" class="status-info">Nenhuma logo personalizada selecionada</p>
            </div>
        </div>

        <!-- 2. SEÇÃO DE MODELOS (CATEGORIAS E BOTÕES) -->
        <div class="card-secao">
            <h3>Escolha o Modelo do Certificado</h3>
            <div class="secao-modelos">
                <label><strong>Filtrar Categoria:</strong></label>
                <div class="botoes-categorias">
                    <button type="button" class="btn-cat active" onclick="filtrarCategoria('todas')">Todas</button>
                    <button type="button" class="btn-cat" onclick="filtrarCategoria('progressao')">Progressão & Acolhida</button>
                    <button type="button" class="btn-cat" onclick="filtrarCategoria('lideranca')">Liderança</button>
                    <button type="button" class="btn-cat" onclick="filtrarCategoria('promessa')">Promessa & Expansão</button>
                    <button type="button" class="btn-cat" onclick="filtrarCategoria('especialidades')">Especialidades</button>
                    <button type="button" class="btn-cat" onclick="filtrarCategoria('insignias')">Insígnias & Ramos</button>
                </div>

                <label style="margin-top: 10px; display: block;"><strong>Selecione o Certificado:</strong></label>
                <div id="container-certificados" class="grid-certificados">
                    <!-- Os botões dos certificados são renderizados dinamicamente pelo JS -->
                </div>

                <!-- Select original mantido invisível para compatibilidade -->
                <select id="modelo" style="display: none;" onchange="atualizarFormulario()"></select>
            </div>
        </div>

        <!-- 3. FORMULÁRIO DE DADOS (Atualiza o Canvas em tempo real a cada digitação) -->
        <div class="card-secao">
            <h3>Dados do Certificado</h3>
            <form id="formCertificado" oninput="gerarCertificado()">
                
                <!-- Campos Gerais -->
                <div class="grid-form">
                    <div class="campo col-full">
                        <label for="nome">Nome Completo:</label>
                        <input type="text" id="nome" placeholder="Digite o nome do agraciado">
                    </div>

                    <div class="campo">
                        <label for="cidade">Cidade:</label>
                        <input type="text" id="cidade" placeholder="Ex: Curitiba">
                    </div>

                    <div class="campo grid-data">
                        <div>
                            <label for="dia">Dia:</label>
                            <input type="text" id="dia" placeholder="01">
                        </div>
                        <div>
                            <label for="mes">Mês:</label>
                            <input type="text" id="mes" placeholder="Janeiro">
                        </div>
                        <div>
                            <label for="ano">Ano:</label>
                            <input type="text" id="ano" placeholder="2026">
                        </div>
                    </div>
                </div>

                <!-- Campos Dinâmicos -->
                <div class="grid-form campos-dinamicos" style="margin-top: 15px;">
                    <div class="campo" id="campo-etapa" style="display: none;">
                        <label for="etapa">Etapa / Nível:</label>
                        <input type="text" id="etapa" placeholder="Ex: Pista / Cordão do Redentor">
                    </div>

                    <div class="campo" id="campo-responsaveis" style="display: none;">
                        <label for="responsaveis">Nome dos Responsáveis:</label>
                        <input type="text" id="responsaveis" placeholder="Nome dos pais ou responsáveis">
                    </div>

                    <div class="campo" id="campo-grupo" style="display: none;">
                        <label for="grupo">Nome do Grupo Escoteiro:</label>
                        <input type="text" id="grupo" placeholder="Ex: G.E. São Paulo 101º">
                    </div>

                    <div class="campo" id="campo-matilha" style="display: none;">
                        <label for="matilha">Matilha:</label>
                        <input type="text" id="matilha" placeholder="Ex: Matilha Vermelha">
                    </div>

                    <div class="campo" id="campo-patrulha" style="display: none;">
                        <label for="patrulha">Patrulha:</label>
                        <input type="text" id="patrulha" placeholder="Ex: Patrulha Lopo">
                    </div>

                    <div class="campo" id="campo-forma_promessa" style="display: none;">
                        <label for="forma_promessa">Forma da Promessa:</label>
                        <input type="text" id="forma_promessa" placeholder="Ex: Solene">
                    </div>

                    <div class="campo" id="campo-quantidade" style="display: none;">
                        <label for="quantidade">Quantidade / Detalhe:</label>
                        <input type="text" id="quantidade" placeholder="Ex: 5 novos membros">
                    </div>

                    <div class="campo" id="campo-anos" style="display: none;">
                        <label for="anos">Anos de Atividade:</label>
                        <input type="text" id="anos" placeholder="Ex: 3 Anos">
                    </div>

                    <div class="campo" id="campo-ramo" style="display: none;">
                        <label for="ramo">Ramo:</label>
                        <input type="text" id="ramo" placeholder="Ex: Ramo Escoteiro">
                    </div>

                    <!-- Especialidades -->
                    <div id="grupo-especialidade" class="col-full" style="display: none;">
                        <div class="grid-form">
                            <div class="campo col-full">
                                <label for="especialidade">Nome da Especialidade:</label>
                                <input type="text" id="especialidade" placeholder="Ex: Primeiros Socorros">
                            </div>

                            <div class="campo" id="campo-nivel" style="display: none;">
                                <label for="nivel">Nível da Especialidade:</label>
                                <input type="text" id="nivel" placeholder="Ex: Nível 2">
                            </div>

                            <div class="campo col-full">
                                <label for="itens">Requisitos / Itens Cumpridos:</label>
                                <input type="text" id="itens" placeholder="Ex: 1, 3, 5 e 8">
                            </div>
                        </div>
                    </div>

                    <!-- Sênior / Pioneiro -->
                    <div id="campo-sp-extra" class="col-full" style="display: none;">
                        <div class="grid-form">
                            <div class="campo">
                                <label for="eixo">Eixo de Desenvolvimento:</label>
                                <input type="text" id="eixo" placeholder="Ex: Físico / Intelectual">
                            </div>

                            <div class="campo">
                                <label for="carga">Carga Horária / Período:</label>
                                <input type="text" id="carga" placeholder="Ex: 20 horas">
                            </div>

                            <div class="campo col-full">
                                <label for="conhecer">Demonstrar Conhecer:</label>
                                <textarea id="conhecer" rows="2" placeholder="Descrição do que foi demonstrado"></textarea>
                            </div>

                            <div class="campo col-full">
                                <label for="fazer">Demonstrar Fazer:</label>
                                <textarea id="fazer" rows="2" placeholder="Descrição da prática realizada"></textarea>
                            </div>

                            <div class="campo col-full">
                                <label for="compartilhar">Demonstrar Compartilhar:</label>
                                <textarea id="compartilhar" rows="2" placeholder="Descrição do compartilhamento"></textarea>
                            </div>
                        </div>
                    </div>
                </div>
            </form>

            <!-- Pré-visualização do Canvas em Tempo Real -->
            <div class="canvas-wrapper">
                <canvas id="canvasCertificado"></canvas>
            </div>

            <button type="button" class="btn-download" onclick="baixarPDF()">Baixar PDF</button>
        </div>

    </div>

    <!-- Script Principal -->
    <script src="app.js"></script>
</body>
</html>
