<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador de Certificados Escoteiros</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --primary-color: #00843D; /* Verde Escoteiro */
      --accent-color: #003B5C;  /* Azul Escoteiro */
      --bg-dark: #12181b;
      --card-dark: #1e262c;
      --text-light: #e0e6ed;
      --border-dark: #323d47;
      --input-bg: #2a343d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-dark);
      /* Substitua 'background.jpg' pelo nome exato do arquivo da sua imagem de fundo */
      background-image: linear-gradient(rgba(18, 24, 27, 0.85), rgba(18, 24, 27, 0.85)), url('background.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: var(--text-light);
      line-height: 1.5;
      padding: 20px 15px;
      min-height: 100vh;
    }

    .container {
      max-width: 850px;
      margin: 0 auto;
      background-color: var(--card-dark);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      border: 1px solid var(--border-dark);
    }

    h1 {
      text-align: center;
      color: #ffffff;
      margin-bottom: 25px;
      font-size: 1.8rem;
      font-weight: 700;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    label {
      font-weight: 600;
      color: #a0aec0;
      display: block;
      font-size: 0.95rem;
    }

    select, input {
      width: 100%;
      padding: 12px 14px;
      margin-top: 6px;
      font-size: 1rem;
      border: 1px solid var(--border-dark);
      border-radius: 8px;
      background-color: var(--input-bg);
      color: #ffffff;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    select optgroup {
      background-color: var(--card-dark);
      color: #ffffff;
    }

    select option {
      background-color: var(--input-bg);
      color: #ffffff;
    }

    select:focus, input:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(0, 132, 61, 0.3);
    }

    #dynamic-fields {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-top: 10px;
    }

    .field-group {
      display: flex;
      flex-direction: column;
    }

    .actions {
      display: flex;
      justify-content: center;
      margin-top: 10px;
    }

    #btn-pdf {
      width: 100%;
      max-width: 280px;
      padding: 14px 20px;
      font-size: 1.05rem;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background-color: var(--primary-color);
      color: #ffffff;
      transition: transform 0.1s ease, background-color 0.2s ease;
    }

    #btn-pdf:hover {
      background-color: #006830;
    }

    #btn-pdf:active {
      transform: scale(0.98);
    }

    .preview-area {
      margin-top: 30px;
      text-align: center;
      overflow-x: auto;
      padding: 10px 0;
    }

    #cert-canvas {
      max-width: 100%;
      height: auto;
      border: 1px solid var(--border-dark);
      border-radius: 8px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.6);
      background-color: #ffffff;
    }

    @media (max-width: 600px) {
      .container {
        padding: 20px 15px;
      }

      #btn-pdf {
        max-width: 100%;
      }

      #dynamic-fields {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Gerador de Certificados Escoteiros</h1>

    <form id="cert-form">
      <!-- Seleção do Modelo -->
      <label for="template-select">Selecione o Certificado:</label>
      <select id="template-select" required>
        <option value="">-- Selecione um modelo --</option>
        
        <!-- Acolhida e Progressão -->
        <optgroup label="Acolhida e Progressão">
          <option value="cert_acolhida">Certificado de Acolhida (Filhotes)</option>
          <option value="progressao_f">Certificado de Progressão Pessoal</option>
          <option value="estrelas_atv">Certificado de Estrela de Atividade</option>
        </optgroup>

        <!-- Liderança -->
        <optgroup label="Liderança">
          <option value="cert_primo">Certificado de Primo(a) (Lobinho)</option>
          <option value="cert_segundo">Certificado de Segundo(a) (Lobinho)</option>
          <option value="cert_monitor_e">Certificado de Monitor(a) (Escoteiro)</option>
          <option value="cert_sub_e">Certificado de Submonitor(a) (Escoteiro)</option>
          <option value="cert_monitor_s">Certificado de Monitor(a) (Sênior)</option>
          <option value="cert_sub_s_2">Certificado de Submonitor(a) (Sênior)</option>
        </optgroup>

        <!-- Promessa e Expansão -->
        <optgroup label="Promessa e Expansão">
          <option value="cert_promessa">Certificado de Promessa (Geral)</option>
          <option value="cert_promessa_l">Certificado de Promessa (Lobinho)</option>
          <option value="cert_recrutador">Certificado de Recrutador</option>
          <option value="ins_semeador">Certificado de Semeador</option>
        </optgroup>

        <!-- Insígnias Especiais e Modalidades -->
        <optgroup label="Insígnias e Modalidades">
          <option value="ins_acao_comunitaria">Insígnia da Ação Comunitária</option>
          <option value="ins_aeronauta">Insígnia do Aeronauta</option>
          <option value="ins_aviador">Insígnia do Aviador</option>
          <option value="ins_boa_acao">Insígnia da Boa Ação</option>
          <option value="ins_campeoes_natureza">Insígnia Campeões da Natureza</option>
          <option value="ins_conesul">Insígnia Cone Sul</option>
          <option value="ins_desafio_comunitario">Insígnia do Desafio Comunitário</option>
          <option value="ins_energia_solar">Insígnia Escoteiros pela Energia Solar</option>
          <option value="ins_grumete">Insígnia do Grumete</option>
          <option value="ins_lusofonia">Insígnia da Lusofonia</option>
          <option value="ins_naval">Insígnia Naval</option>
          <option value="ins_rrr">Insígnia Reduzir, Reciclar, Reutilizar</option>
        </optgroup>
      </select>

      <!-- Campos Dinâmicos -->
      <div id="dynamic-fields"></div>

      <!-- Botão Único para Baixar PDF -->
      <div class="actions">
        <button type="submit" id="btn-pdf">Baixar PDF</button>
      </div>
    </form>

    <!-- Canvas para renderização -->
    <div class="preview-area">
      <canvas id="cert-canvas"></canvas>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
